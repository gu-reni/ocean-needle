<style>
html { -webkit-text-size-adjust: 100%; }
body {
  max-width: 46em; margin: 0 auto; padding: 2.2em 1.4em 4em;
  font-family: "Noto Sans CJK SC","Noto Sans CJK","Source Han Sans SC",
               "Microsoft YaHei","PingFang SC",system-ui,-apple-system,sans-serif;
  font-size: 16px; line-height: 1.78; color: #23272e; background: #fff;
}
h1 { font-size: 1.85em; line-height: 1.3; margin: 0 0 .4em; padding-bottom: .35em; border-bottom: 3px solid #1a6ee8; color: #16324f; }
h2 { font-size: 1.35em; margin: 2.2em 0 .7em; padding: .35em 0 .35em .65em; border-left: 5px solid #1a6ee8; background: #f4f8ff; color: #16324f; }
h3 { font-size: 1.1em; margin: 1.9em 0 .45em; color: #0f4c8f; }
h3 + p, h3 + ul { margin-top: .3em; }
strong { color: #0b2b45; }
a { color: #0a58ca; word-break: break-all; }
a:hover { text-decoration: none; }
code { background: #f2f4f7; padding: .12em .38em; border-radius: 3px; font-size: .9em; }
pre { background: #f6f8fa; padding: .85em 1em; border-radius: 6px; overflow-x: auto; border: 1px solid #e3e8ee; }
pre code { background: none; padding: 0; }
table { border-collapse: collapse; width: 100%; margin: 1em 0; font-size: .93em; }
th, td { border: 1px solid #d8dee6; padding: .5em .65em; vertical-align: top; text-align: left; }
th { background: #f2f6fb; }
blockquote { margin: 1em 0; padding: .6em 1em; border-left: 4px solid #c9d6e5; background: #fafbfd; color: #4a5568; }
hr { border: none; border-top: 1px solid #e3e8ee; margin: 2.4em 0; }
@media (max-width: 600px) {
  body { font-size: 15px; padding: 1.2em .9em 3em; }
  h1 { font-size: 1.55em; } h2 { font-size: 1.2em; }
}
</style>
